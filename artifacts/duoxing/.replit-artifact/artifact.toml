kind = "web"
previewPath = "/"
title = "都行"
description = "A mobile-first PWA for two people to privately share food preferences and reveal the strongest mutual meal recommendation, with shareable temporary rooms and no account required."
version = "1.0.0"
id = "artifacts/duoxing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18911

[services.development]
run = "pnpm --filter @workspace/duoxing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/duoxing", "run", "build" ]
serve = "static"
publicDir = "artifacts/duoxing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18911"
BASE_PATH = "/"

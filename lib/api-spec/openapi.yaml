openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Anonymous shared meal-decision rooms
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rooms:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a room and join as its first participant
      parameters:
        - $ref: "#/components/parameters/AuthClientVersion"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreateInput"
      responses:
        "503":
          $ref: "#/components/responses/UpgradePause"
        "426":
          $ref: "#/components/responses/ClientUpgradeRequired"
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomParticipantResponse"
  /rooms/{roomCode}/me:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get progress and only the requesting participant's saved draft
      description: Bearer token identifies the caller. Only the caller's draft is returned. Legacy URL authentication is retired in token mode.
      security: [{ participantBearer: [] }]
      parameters:
        - name: roomCode
          in: path
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 6
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "426":
          $ref: "#/components/responses/ClientUpgradeRequired"
        "200":
          description: Current room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStatus"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomCode}/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a room as an anonymous participant
      parameters:
        - $ref: "#/components/parameters/AuthClientVersion"
        - name: roomCode
          in: path
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 6
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantInput"
      responses:
        "426":
          $ref: "#/components/responses/ClientUpgradeRequired"
        "201":
          description: Joined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomParticipantResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Room is full or already revealed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomCode}/preferences:
    put:
      security: [{ participantBearer: [] }]
      operationId: submitPreferences
      tags: [rooms]
      summary: Save a participant's private preferences
      parameters:
        - name: roomCode
          in: path
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferenceSubmission"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/IdentityMismatch"
        "200":
          description: Preferences saved and current room state returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStatus"
        "400":
          description: Invalid preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room or participant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomCode}/reset:
    post:
      security: [{ participantBearer: [] }]
      operationId: resetRoom
      tags: [rooms]
      summary: Keep private drafts, clear both confirmations and invalidate old results
      parameters:
        - name: roomCode
          in: path
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomResetInput"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/IdentityMismatch"
        "200":
          description: Room reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStatus"
        "404":
          description: Room or participant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomCode}/recommendations/reroll:
    post:
      security: [{ participantBearer: [] }]
      operationId: rerollRecommendations
      tags: [rooms]
      summary: Show the next set of recommendations without changing preferences
      parameters:
        - name: roomCode
          in: path
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerollRecommendationsInput"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/IdentityMismatch"
        "200":
          description: Next recommendation set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStatus"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Both participants have not submitted yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room or participant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    AuthClientVersion:
      name: X-Duoxing-Auth
      in: header
      required: false
      description: Required with value token-v1 in token mode; rejects old cached clients before allocating identities. Not an authentication secret.
      schema:
        type: string
  responses:
    AuthenticationRequired:
      description: Missing, invalid, cross-room or expired participant token. A matching credential on an expired room read may receive code ROOM_EXPIRED; no private content is returned. Deleted rooms cannot be distinguished from invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdentityMismatch:
      description: The public body identity does not match the authenticated caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ClientUpgradeRequired:
      description: Old authentication is retired; reconnect and refresh the cached client.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpgradePause:
      description: Creation paused during drain; existing rooms remain usable.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  securitySchemes:
    participantBearer:
      type: http
      scheme: bearer
      description: Independent 256-bit anonymous participant token, never a URL parameter.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum: [ROOM_EXPIRED]
          description: Safe expiry marker for an expired room join or an authenticated expired room read; never includes private data.
      required: [error]
    RoomCreateInput:
      type: object
      properties:
        durationHours:
          type: integer
          enum: [1, 3, 12, 24]
          description: Fixed lifetime in hours. Omission preserves the legacy 24-hour default; new clients explicitly send 12 by default. Server computes expiresAt.
        nickname:
          type: string
          maxLength: 24
    ParticipantInput:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 24
    RoomParticipantResponse:
      type: object
      properties:
        roomCode:
          type: string
        participantId:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: Server-owned room expiry, for display only; never authorizes access.
        participantToken:
          type: string
          description: Returned once on token-mode creation/join; store privately. Absent during legacy/drain.
          pattern: "^[a-f0-9]{64}$"
      required: [roomCode, participantId, expiresAt]
    BudgetLevel:
      type: string
      enum: ["1", "2", "3", unlimited]
    DistanceLimit:
      type: string
      enum: ["1", "3", "5", unlimited]
    Cuisine:
      type: string
      enum: [中餐, 火锅, 日料, 韩餐, 西餐, 东南亚, 烧烤, 小吃, 咖啡 / 甜品]
    CuisineAttitude:
      type: string
      enum: [love, okay, avoid]
    SpicePreference:
      type: string
      enum: [none, mild, any]
    CuisinePreference:
      type: object
      properties:
        cuisine:
          $ref: "#/components/schemas/Cuisine"
        attitude:
          $ref: "#/components/schemas/CuisineAttitude"
      required: [cuisine, attitude]
    PreferenceSubmission:
      type: object
      properties:
        participantId:
          type: string
        nickname:
          type: string
          maxLength: 24
        budget:
          $ref: "#/components/schemas/BudgetLevel"
        distance:
          $ref: "#/components/schemas/DistanceLimit"
        cuisinePreferences:
          type: array
          items:
            $ref: "#/components/schemas/CuisinePreference"
        spice:
          $ref: "#/components/schemas/SpicePreference"
        preferenceRevision:
          type: integer
          minimum: 1
      required: [participantId, budget, distance, cuisinePreferences, spice, preferenceRevision]
    RoomResetInput:
      type: object
      properties:
        participantId:
          type: string
      required: [participantId]
    RerollRecommendationsInput:
      type: object
      properties:
        participantId:
          type: string
      required: [participantId]
    RestaurantRecommendation:
      type: object
      properties:
        name:
          type: string
        cuisine:
          $ref: "#/components/schemas/Cuisine"
        priceLevel:
          type: integer
        distance:
          type: number
        spicyLevel:
          type: integer
        matchScore:
          type: integer
          minimum: 0
          maximum: 100
        reasons:
          type: array
          items:
            type: string
      required: [name, cuisine, priceLevel, distance, spicyLevel, matchScore, reasons]
    RoomStatus:
      type: object
      properties:
        roomCode:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: Server-owned room expiry, for display only; never authorizes access.
        participantId:
          type: ["string", "null"]
        participantCount:
          type: integer
        submittedCount:
          type: integer
        requiredParticipantCount:
          type: integer
        hasSubmitted:
          type: boolean
        ownDraft:
          $ref: "#/components/schemas/PrivatePreferenceDraft"
        preferenceRevision:
          type: integer
        algorithmVersion:
          type: string
        hasMoreRecommendations:
          type: boolean
        candidateCount:
          type: integer
        state:
          type: string
          enum: [choosing, waiting_for_partner, waiting_for_other, revealed]
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/RestaurantRecommendation"
      required: [roomCode, expiresAt, participantId, participantCount, submittedCount, requiredParticipantCount, hasSubmitted, ownDraft, preferenceRevision, algorithmVersion, hasMoreRecommendations, candidateCount, state, recommendations]
    PrivatePreferenceDraft:
      type: [object, "null"]
      description: Last saved preferences of the requesting participant only; null before their first submission. Not a current-round confirmation.
      properties:
        nickname:
          type: string
        budget:
          $ref: "#/components/schemas/BudgetLevel"
        distance:
          $ref: "#/components/schemas/DistanceLimit"
        cuisinePreferences:
          type: array
          items:
            $ref: "#/components/schemas/CuisinePreference"
        spice:
          $ref: "#/components/schemas/SpicePreference"
      required: [nickname, budget, distance, cuisinePreferences, spice]

